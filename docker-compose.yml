# Rent-A-Car / AutoHub: SQL Server + API (profile prod).
# Copy .env.example -> .env and fill in secrets.
# Run: docker compose up --build
#
# VPS + domain: host Nginx proxies to WEB_PORT (web container). /api is proxied inside Docker to api:8080.
# API_PORT / MSSQL_PORT only change loopback on the host (local tools); they do not change public URLs.

name: rentacar

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    hostname: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    # Host port default 14330: Windows often blocks 127.0.0.1:1433 (Hyper-V / local SQL Server).
    ports:
      - "127.0.0.1:${MSSQL_PORT:-14330}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null || exit 1"]
      interval: 15s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  db-init:
    build:
      context: ./docker/sqlserver-init
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_started
    environment:
      DB_HOST: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      # Dat 1 lan tren VPS khi can ep thay 70 xe + gallery: FORCE_CATALOG_SYNC=1
      FORCE_CATALOG_SYNC: ${FORCE_CATALOG_SYNC:-0}
    restart: "no"

  api:
    build:
      context: ./backend/rentACar
    platform: linux/amd64
    # Host port default 8088: 8080 is often taken (Tomcat, other stacks, old containers).
    ports:
      - "127.0.0.1:${API_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/actuator/health/liveness -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 150s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=autohub;encrypt=false;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${MSSQL_SA_PASSWORD}
      JWT_KEY: ${JWT_KEY}
      APP_ADMIN_SEED_EMAIL: ${APP_ADMIN_SEED_EMAIL:-admin@autohub.id.vn}
      APP_ADMIN_SEED_PASSWORD: ${APP_ADMIN_SEED_PASSWORD:-admin123@}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8088,http://127.0.0.1:8088}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      APP_UPLOAD_ROOT: /app/uploads
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_KYC_AUTO_APPROVE: ${APP_KYC_AUTO_APPROVE:-false}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: rentacar-web
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    platform: linux/amd64
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mssql_data:
  uploads_data:
