# Rent-A-Car / AutoHub: SQL Server + API (profile prod).
# Copy .env.example -> .env and fill in secrets.
# Run: docker compose up --build

name: rentacar

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    hostname: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null || exit 1"]
      interval: 15s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  db-init:
    build:
      context: ./docker/sqlserver-init
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_started
    environment:
      DB_HOST: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    restart: "no"

  api:
    build:
      context: ./backend/rentACar
    platform: linux/amd64
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/actuator/health/liveness -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 150s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=autohub;encrypt=false;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${MSSQL_SA_PASSWORD}
      JWT_KEY: ${JWT_KEY}
      APP_ADMIN_SEED_EMAIL: ${APP_ADMIN_SEED_EMAIL:-admin@autohub.local}
      APP_ADMIN_SEED_PASSWORD: ${APP_ADMIN_SEED_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      APP_UPLOAD_ROOT: /app/uploads
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: rentacar-web
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    platform: linux/amd64
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mssql_data:
  uploads_data:
