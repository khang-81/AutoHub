# Blueprint Render: Web service (Docker) — API Spring Boot.
# Tạo project trên https://render.com → New Blueprint → chọn repo này.
# Bí mật (JWT, DB, CORS) cấu hình trong Render Dashboard → Environment (không commit).

services:
  - type: web
    name: rentacar-api
    runtime: docker
    dockerfilePath: ./backend/rentACar/Dockerfile
    dockerContext: ./backend/rentACar
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JPA_DDL_AUTO
        value: update
      # Bổ sung trong Dashboard: SPRING_DATASOURCE_URL, USERNAME, PASSWORD, JWT_KEY,
      # APP_CORS_ALLOWED_ORIGINS, SPRING_DATASOURCE_DRIVER_CLASS_NAME, SPRING_JPA_DATABASE_PLATFORM
