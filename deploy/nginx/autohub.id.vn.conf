# Nginx host vhost for autohub.id.vn — copy to /etc/nginx/sites-available/
# After SSL: certbot --nginx -d autohub.id.vn -d www.autohub.id.vn will add 443 block + redirect.

server {
    listen 80;
    listen [::]:80;
    server_name autohub.id.vn www.autohub.id.vn;

    # KYC uploads can be up to a few MB; backend already caps at 5MB per file.
    client_max_body_size 10m;

    # Long-running SSE/streaming endpoints (AI chat) need bigger read timeout.
    proxy_buffering off;
    proxy_request_buffering off;

    # ACME http-01 challenge (certbot --webroot fallback); --nginx plugin also handles this.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Authorization     $http_authorization;

        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
