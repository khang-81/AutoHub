# =====================================================
# AutoHub - Rent A Car Application Configuration
# =====================================================
# Không đưa mật khẩu/API key thật lên Git — dùng biến môi trường hoặc application-local.properties (đã gitignore).
# Local dev: mặc định không cần profile.
# Production: SPRING_PROFILES_ACTIVE=prod — xem application-prod.properties và env.example

spring.config.import=optional:classpath:application-local.properties

# Server
server.port=${PORT:8080}

# CORS — comma-separated browser origins allowed to call this API (must match your frontend URL, no path)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://127.0.0.1:5173,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080}

# Database — SQL Server ONLY (no PostgreSQL / MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://sqlserver:1433;databaseName=autohub;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway — migrations run after JPA schema update
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT — BẮT BUỘC set JWT_KEY qua env. Không có default (BUGFIX #1 — JwtService sẽ fail-fast
# nếu thiếu hoặc trùng secret cũ đã lộ trên Git).
jwt.key=${JWT_KEY:}
# 7 ngày — giảm phải đăng nhập lại thường xuyên
jwt.expiration=${JWT_EXPIRATION:604800000}

# Admin seed — BẮT BUỘC set APP_ADMIN_SEED_PASSWORD qua env ở production.
# Local dev / Docker có thể set trực tiếp trong application-local.properties (đã gitignore).
app.admin.seed-email=${APP_ADMIN_SEED_EMAIL:admin@autohub.id.vn}
app.admin.seed-password=${APP_ADMIN_SEED_PASSWORD:}

# Mail — đặt MAIL_USERNAME / MAIL_PASSWORD (vd. Gmail App Password) hoặc application-local.properties
mail.username=${MAIL_USERNAME:}
mail.password=${MAIL_PASSWORD:}

# Link trong email quên mật khẩu (origin frontend, không có path cuối)
app.frontend.base-url=${FRONTEND_URL:http://localhost:5173}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.root=WARN
logging.level.com.tobeto.rentACar=INFO
logging.level.org.springframework.security=WARN

# Arcanic (OpenAI-compatible) — ARCANIC_API_KEY trong env (không commit key)
arcanic.api.base-url=${ARCANIC_BASE_URL:https://api.arcanic.ai/v1}
arcanic.api.key=${ARCANIC_API_KEY:}
arcanic.api.model=${ARCANIC_MODEL:cono-3}
arcanic.api.chat-max-tokens=${ARCANIC_CHAT_MAX_TOKENS:2000}

# Payment / bank transfer info — set via env vars on production
payment.bank.code=${PAYMENT_BANK_CODE:TCB}
payment.bank.name=${PAYMENT_BANK_NAME:Techcombank}
payment.bank.account-number=${PAYMENT_BANK_ACCOUNT_NUMBER:19036501234567}
payment.bank.account-name=${PAYMENT_BANK_ACCOUNT_NAME:CTCP AUTOHUB}

# KYC file uploads (relative to working directory when running locally)
app.upload.root=uploads

# KYC luôn phải chờ admin duyệt. Trước đây có tuỳ chọn auto-approve qua APP_KYC_AUTO_APPROVE,
# nhưng đã loại bỏ để đảm bảo mọi hồ sơ đều qua review thủ công (tránh giả mạo giấy tờ).
# Nếu cần bootstrap dữ liệu demo đã APPROVED, dùng SQL seed (docker/sqlserver-init/sync-demo-data.sql).

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ─── Mức D: Actuator (health/info) — chi tiết DB chỉ khi có quyền ───
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

info.app.name=AutoHub Rent-A-Car
info.app.description=API thuê & mua xe (Spring Boot)
