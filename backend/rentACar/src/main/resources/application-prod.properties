# Production profile — bí mật qua biến môi trường (không commit giá trị thật).
# Chạy: SPRING_PROFILES_ACTIVE=prod   hoặc   java -jar app.jar --spring.profiles.active=prod
#
# Bắt buộc: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
#           JWT_KEY, APP_CORS_ALLOWED_ORIGINS

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://sqlserver:1433;databaseName=autohub;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

jwt.key=${JWT_KEY}
jwt.expiration=${JWT_EXPIRATION:604800000}

# Default CORS origins for Docker web + Vite dev
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}

mail.username=${MAIL_USERNAME:}
mail.password=${MAIL_PASSWORD:}

# Origin site (không có / cuối) — dùng trong email quên mật khẩu
app.frontend.base-url=${FRONTEND_URL:http://localhost:5173}

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}

app.upload.root=${APP_UPLOAD_ROOT:uploads}

# Bat/tat tu duyet GPLX (env APP_KYC_AUTO_APPROVE). Mac dinh false neu khong set trong .env VPS.
app.kyc.auto-approve=${APP_KYC_AUTO_APPROVE:false}

# Đồng bộ tài khoản admin khi khởi động (đặt APP_ADMIN_SEED_PASSWORD= rỗng nếu muốn tắt).
app.admin.seed-email=${APP_ADMIN_SEED_EMAIL:admin@autohub.id.vn}
app.admin.seed-password=${APP_ADMIN_SEED_PASSWORD:admin123@}

# Lần đầu triển khai DB trống có thể cần update; sau đó nên validate/none
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

server.port=${PORT:8080}
# Required in Docker: listen on all interfaces (Nginx calls api:8080)
server.address=0.0.0.0

logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.com.tobeto.rentACar=${LOG_LEVEL_APP:INFO}

# Actuator: chỉ health + info; không lộ env/beans
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
