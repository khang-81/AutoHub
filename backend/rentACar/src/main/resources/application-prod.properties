# Production profile — bí mật qua biến môi trường (không commit giá trị thật).
# Chạy: SPRING_PROFILES_ACTIVE=prod   hoặc   java -jar app.jar --spring.profiles.active=prod
#
# Bắt buộc: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
#           JWT_KEY, APP_CORS_ALLOWED_ORIGINS

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

jwt.key=${JWT_KEY}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Mặc định gồm Docker web (3001), Vite (3000/5173/3002) — tránh 403 CORS khi SPA gọi thẳng API :8081 (override dev)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}

mail.username=${MAIL_USERNAME:}
mail.password=${MAIL_PASSWORD:}

# Origin site (không có / cuối) — dùng trong email quên mật khẩu
app.frontend.base-url=${FRONTEND_URL:http://localhost:5173}

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}

app.upload.root=${APP_UPLOAD_ROOT:uploads}

# Đồng bộ tài khoản admin khi khởi động (để trống = tắt). Docker Compose mặc định bật mật khẩu demo.
app.admin.seed-email=${APP_ADMIN_SEED_EMAIL:admin@autohub.local}
app.admin.seed-password=${APP_ADMIN_SEED_PASSWORD:}

# Lần đầu triển khai DB trống có thể cần update; sau đó nên validate/none
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

server.port=${PORT:8080}
# Bắt buộc trong Docker: lắng nghe mọi interface (Nginx gọi qua tên service api:8081)
server.address=0.0.0.0

logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.com.tobeto.rentACar=${LOG_LEVEL_APP:INFO}

# Actuator: chỉ health + info; không lộ env/beans
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
