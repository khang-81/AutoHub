services:
  # Dev override: chạy Vite trong container để hot-reload UI ngay khi sửa code.
  web:
    # `build: null` không xóa build khi merge → Compose vẫn build + tag trùng `image` → ghi đè image Node (mất npm).
    build: !reset null
    # Tag khác `node:22-bookworm-slim@…` trong Dockerfile để tránh nhầm lẫn khi có build cũ.
    image: node:22-bookworm
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 80"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # Trình duyệt gọi API host:8081 (khác origin với WEB_PORT, vd. :3001) — API phải cho phép CORS (APP_CORS_ALLOWED_ORIGINS trong .env / docker-compose).
      VITE_API_URL: http://localhost:8081
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
