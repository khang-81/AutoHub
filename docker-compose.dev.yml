# Dev overlay: Vite HMR thay Nginx production build.
# Chạy: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Sửa code frontend → trình duyệt tự cập nhật (không cần docker compose build web).

name: rentacar

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: rentacar-web-dev
    # Ghi đè port production (3000:80) — Compose MERGE ports → trùng host port → lỗi bind
    ports: !override
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      VITE_DEV_PROXY_TARGET: http://api:8080
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  web_node_modules:
